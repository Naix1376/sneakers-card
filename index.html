<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мини-магазин</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#1d4ed8;--accent-ink:#fff;--off:#e5e7eb;--off-ink:#9ca3af;--sale:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b2e;--ink:#f3f4f6;--muted:#9ca3af;--line:#374151;--accent:#60a5fa;--accent-ink:#0b1020;--off:#1f2937;--off-ink:#4b5563;--sale:#fb923c}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b2e;--ink:#f3f4f6;--muted:#9ca3af;--line:#374151;--accent:#60a5fa;--accent-ink:#0b1020;--off:#1f2937;--off-ink:#4b5563;--sale:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:21}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{margin:24px auto;width:calc(100% - 32px);max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}
@media(max-width:620px){.card{grid-template-columns:1fr}}
.pic{position:relative;overflow:hidden;background:linear-gradient(160deg,#0f172a,#1e3a8a);border-radius:10px;display:flex;align-items:center;justify-content:center;min-height:280px}
.emo{position:absolute;font-size:6rem}
.pic img{position:relative;display:block;width:100%;height:auto;max-height:85vh;object-fit:contain}
h1{font-size:1.4rem;line-height:1.25;margin:0 0 4px}
.brand{color:var(--muted);margin:0 0 8px}
.rating{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.stars{color:#f59e0b;letter-spacing:2px}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.now{font-size:1.8rem;font-weight:700;color:var(--sale)}
.old{color:var(--muted);text-decoration:line-through}
.badge{background:var(--sale);color:var(--bg);font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:999px}
.label{font-weight:600;margin:0 0 8px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.size{min-width:48px;height:44px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.size:hover:not(:disabled){border-color:var(--accent)}
.size[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.size:disabled{background:var(--off);color:var(--off-ink);border-color:var(--off);cursor:not-allowed;text-decoration:line-through}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 16px;min-height:1.4em}
.buy{width:100%;height:48px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.buy:disabled{background:var(--off);color:var(--off-ink);cursor:not-allowed}
.buy.alt{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.buy.alt:disabled{border-color:var(--off);color:var(--off-ink);background:var(--off)}
.cart{position:relative;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.cart svg{width:24px;height:24px}
.count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--sale);color:var(--bg);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.count[hidden]{display:none}
.fly{position:fixed;left:0;top:0;width:220px;height:72px;display:flex;gap:10px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:.8rem;line-height:1.3;pointer-events:none;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fly-pic{width:48px;height:48px;border-radius:8px;background:linear-gradient(160deg,#0f172a,#1e3a8a);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slidein .25s ease-out}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer[hidden],.overlay[hidden]{display:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px}
.dh h2{margin:0;font-size:1.2rem}
.x{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 12px;color:var(--muted);font-size:.9rem}
.ghost{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.list{flex:1;overflow-y:auto;padding:0 16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.info{flex:1;min-width:120px;display:flex;flex-direction:column;cursor:pointer}
.info small{color:var(--muted)}
.lp{font-weight:700;min-width:64px;text-align:right}
.empty{color:var(--muted)}
.del{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:#ef4444;font-size:1rem;font-weight:700;cursor:pointer;flex:none}
.del:hover{background:rgba(239,68,68,.15)}
.qty{display:inline-flex;align-items:center;gap:6px;flex:none}
.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;line-height:1;cursor:pointer}
.qty button:disabled{color:var(--off-ink);cursor:not-allowed}
.qty span{min-width:20px;text-align:center}
.foot{padding:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-size:1.1rem}
.sum b{font-size:1.5rem;color:var(--sale)}
.msg{margin:0;min-height:1.4em;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<header class="top">
  <nav id="nav" aria-label="Каталог"><a href="#sneakers">Кроссовки</a><a href="#dress">Платье «Ангелина»</a></nav>
  <button class="cart" id="cart" type="button" aria-label="Корзина"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.7a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span class="count" id="count" hidden>0</span></button>
</header>
<main class="card" id="view"></main>
<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt" hidden>
  <div class="dh"><h2 id="dt">Корзина</h2><button type="button" class="x" id="closecart" aria-label="Закрыть корзину">✕</button></div>
  <div class="bar"><button type="button" class="ghost" id="all">Выбрать все товары</button><span id="selcount"></span></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <div class="sum"><span>Итого за выбранное</span><b id="total">$0,00</b></div>
    <button type="button" class="buy" id="pay">Перейти к оплате</button>
    <button type="button" class="buy alt" id="cod">Оплатить при получении</button>
    <p class="msg" id="msg" role="status"></p>
  </div>
</aside>
<script>
(function(){
  function range(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r;}
  var P={
    sneakers:{name:'Кроссовки Forever Sister X',brand:'Forever Sister · молодёжная серия',rating:true,sizes:range(35,48),stock:function(s){return s<=43;},price:function(s){return 115+5*(s-35);},disc:0.15,img:'images/sneakers.jpg',emo:'👟'},
    dress:{name:'Платье «Ангелина»',brand:'Коллекция «Ангелина»',rating:false,sizes:range(38,44),stock:function(){return true;},price:function(){return 79;},disc:0.05,img:'images/dress.jpg',emo:'👗'}
  };
  function fmt(n){return '$'+n.toFixed(2).replace('.',',');}
  function unit(k,s){return P[k].price(s)*(1-P[k].disc);}
  var view=document.getElementById('view'), links=document.querySelectorAll('#nav a');
  var cartBtn=document.getElementById('cart'), countEl=document.getElementById('count');
  var drawer=document.getElementById('drawer'), overlay=document.getElementById('overlay'), list=document.getElementById('list');
  var allBtn=document.getElementById('all'), totalEl=document.getElementById('total'), selCount=document.getElementById('selcount');
  var payBtn=document.getElementById('pay'), codBtn=document.getElementById('cod'), msg=document.getElementById('msg');
  var reduce=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur='sneakers', sel=null;
  var items=[{k:'sneakers',size:38,qty:1,on:true},{k:'sneakers',size:41,qty:1,on:true},{k:'dress',size:42,qty:1,on:false}];

  function route(){var h=location.hash.slice(1); cur=P[h]?h:'sneakers'; sel=null; renderProduct();}
  function renderProduct(){
    var p=P[cur];
    [].forEach.call(links,function(a){a.setAttribute('aria-current',a.getAttribute('href')==='#'+cur?'page':'false');});
    document.title=p.name+' — мини-магазин';
    view.innerHTML='<div class="pic" id="pic"><span class="emo" aria-hidden="true">'+p.emo+'</span><img alt="'+p.name+'" src="'+p.img+'"></div><div><h1>'+p.name+'</h1><p class="brand">'+p.brand+'</p>'+(p.rating?'<div class="rating"><span class="stars">★★★★☆</span> 4,0</div>':'')+'<div class="price"><span class="now" id="now"></span><span class="old" id="old"></span>'+(p.disc?'<span class="badge">−'+Math.round(p.disc*100)+'%</span>':'')+'</div><p class="label">Размер</p><div class="sizes" id="sizes"></div><p class="hint" id="hint" aria-live="polite">Выберите размер</p><button class="buy" id="buy" type="button" disabled>Выберите размер</button></div>';
    var im=view.querySelector('img'); im.onerror=function(){im.remove();};
    document.getElementById('buy').addEventListener('click',onBuy);
    renderSizes(); setPrice();
  }
  function renderSizes(){
    var p=P[cur], wrap=document.getElementById('sizes'); wrap.innerHTML='';
    p.sizes.forEach(function(s){
      var b=document.createElement('button'); b.type='button'; b.className='size'; b.textContent=s;
      if(!p.stock(s)){ b.disabled=true; b.title='Нет в наличии'; }
      else{
        b.title=fmt(unit(cur,s)); b.setAttribute('aria-pressed',s===sel?'true':'false');
        b.addEventListener('click',function(){ sel=s; renderSizes(); setPrice(); var buy=document.getElementById('buy'); buy.disabled=false; buy.textContent='В корзину, размер '+s; document.getElementById('hint').textContent='Выбран размер '+s; });
      }
      wrap.appendChild(b);
    });
  }
  function setPrice(){
    var p=P[cur], s=sel||p.sizes[0];
    document.getElementById('now').textContent=(sel?'':'от ')+fmt(unit(cur,s));
    document.getElementById('old').textContent=p.disc?fmt(p.price(s)):'';
  }
  function onBuy(){
    if(!sel) return;
    var f=items.filter(function(i){return i.k===cur&&i.size===sel;})[0];
    if(f){f.qty++;f.on=true;}else items.push({k:cur,size:sel,qty:1,on:true});
    renderCart();
    if(reduce) return;
    var src=document.getElementById('pic').getBoundingClientRect(), dst=cartBtn.getBoundingClientRect();
    var fly=document.createElement('div'); fly.className='fly';
    fly.innerHTML='<div class="fly-pic">'+P[cur].emo+'</div><div><b>'+P[cur].name+'</b><br>Размер '+sel+' · '+fmt(unit(cur,sel))+'</div>';
    document.body.appendChild(fly);
    var sx=src.left+src.width/2-110, sy=src.top+src.height/2-36, ex=dst.left+dst.width/2-110, ey=dst.top+dst.height/2-36;
    var a=fly.animate([{transform:'translate('+sx+'px,'+sy+'px) scale(1)',opacity:1},{transform:'translate('+ex+'px,'+ey+'px) scale(.12)',opacity:.4}],{duration:800,easing:'cubic-bezier(.5,0,.75,0)'});
    a.onfinish=function(){ fly.remove(); cartBtn.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:300}); };
  }

  function qtyTotal(){return items.reduce(function(a,i){return a+i.qty;},0);}
  function chosen(){return items.filter(function(i){return i.on;});}
  function selTotal(){return chosen().reduce(function(a,i){return a+unit(i.k,i.size)*i.qty;},0);}
  function badge(){var n=qtyTotal(); countEl.textContent=n; countEl.hidden=n===0; cartBtn.setAttribute('aria-label',n?'Корзина, товаров: '+n:'Корзина пуста');}
  function renderTotals(){
    var c=chosen(), every=items.length>0&&c.length===items.length;
    totalEl.textContent=fmt(selTotal());
    selCount.textContent='Выбрано: '+c.length+' из '+items.length;
    allBtn.textContent=every?'Снять выбор':'Выбрать все товары';
    allBtn.disabled=!items.length;
    payBtn.disabled=codBtn.disabled=!c.length;
  }
  function renderCart(){
    badge(); list.innerHTML='';
    if(!items.length) list.innerHTML='<p class="empty">В корзине пока пусто. Выберите товар и размер и нажмите «В корзину».</p>';
    items.forEach(function(it,idx){
      var name=P[it.k].name, row=document.createElement('div'); row.className='row'; var id='cb-'+idx;
      var cb=document.createElement('input'); cb.type='checkbox'; cb.id=id; cb.checked=it.on;
      cb.addEventListener('change',function(){ it.on=cb.checked; renderTotals(); });
      var del=document.createElement('button'); del.type='button'; del.className='del'; del.textContent='✕';
      del.setAttribute('aria-label','Удалить из корзины: '+name+', размер '+it.size);
      del.addEventListener('click',function(){ items=items.filter(function(i){return i!==it;}); renderCart(); });
      var info=document.createElement('label'); info.className='info'; info.htmlFor=id;
      var b=document.createElement('b'); b.textContent=name;
      var sm=document.createElement('small'); info.appendChild(b); info.appendChild(sm);
      var p=document.createElement('span'); p.className='lp';
      var qty=document.createElement('span'); qty.className='qty';
      var minus=document.createElement('button'); minus.type='button'; minus.textContent='−'; minus.setAttribute('aria-label','Уменьшить количество');
      var q=document.createElement('span'); q.setAttribute('aria-live','polite');
      var plus=document.createElement('button'); plus.type='button'; plus.textContent='+'; plus.setAttribute('aria-label','Увеличить количество');
      function sync(){
        q.textContent=it.qty; minus.disabled=it.qty<=1; plus.disabled=it.qty>=99;
        sm.textContent='Размер '+it.size+' · '+fmt(unit(it.k,it.size))+' × '+it.qty;
        p.textContent=fmt(unit(it.k,it.size)*it.qty);
        badge(); renderTotals();
      }
      minus.addEventListener('click',function(){ if(it.qty>1){it.qty--;sync();} });
      plus.addEventListener('click',function(){ if(it.qty<99){it.qty++;sync();} });
      qty.appendChild(minus); qty.appendChild(q); qty.appendChild(plus);
      row.appendChild(cb); row.appendChild(del); row.appendChild(info); row.appendChild(qty); row.appendChild(p);
      list.appendChild(row); sync();
    });
    renderTotals();
  }
  function openCart(){ msg.textContent=''; drawer.hidden=false; overlay.hidden=false; document.getElementById('closecart').focus(); }
  function closeCart(){ drawer.hidden=true; overlay.hidden=true; cartBtn.focus(); }
  cartBtn.addEventListener('click',openCart);
  overlay.addEventListener('click',closeCart);
  document.getElementById('closecart').addEventListener('click',closeCart);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!drawer.hidden) closeCart(); });
  allBtn.addEventListener('click',function(){ var every=items.length>0&&chosen().length===items.length; items.forEach(function(i){i.on=!every;}); renderCart(); });
  payBtn.addEventListener('click',function(){ msg.textContent='Переходим к оплате заказа на '+fmt(selTotal())+'. Это демо: настоящей оплаты здесь нет.'; });
  codBtn.addEventListener('click',function(){ var s=selTotal(); items=items.filter(function(i){return !i.on;}); renderCart(); msg.textContent='Заказ на '+fmt(s)+' оформлен. Оплата при получении.'; });
  window.addEventListener('hashchange',route);
  renderCart(); route();
})();
</script>
</body>
</html>
