<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мини-магазин</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="top">
  <nav id="nav" aria-label="Каталог"></nav>
  <button class="cart" id="cart" type="button" aria-label="Корзина"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.7a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span class="count" id="count" hidden>0</span></button>
</header>
<main class="card" id="view"></main>
<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt" hidden>
  <div class="dh"><h2 id="dt">Корзина</h2><button type="button" class="x" id="closecart" aria-label="Закрыть корзину">✕</button></div>
  <div class="bar"><button type="button" class="ghost" id="all">Выбрать все товары</button><span id="selcount"></span></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <div class="sum"><span>Итого за выбранное</span><b id="total">$0,00</b></div>
    <button type="button" class="buy" id="pay">Перейти к оплате</button>
    <button type="button" class="buy alt" id="cod">Оплатить при получении</button>
    <form class="order" id="order" hidden>
      <h3>Оформление заказа</h3>
      <input id="o-name" name="name" placeholder="Ваше имя" required autocomplete="name" aria-label="Ваше имя">
      <input name="phone" type="tel" placeholder="Телефон" required autocomplete="tel" aria-label="Телефон">
      <input name="address" placeholder="Адрес доставки" required autocomplete="street-address" aria-label="Адрес доставки">
      <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">
      <small>Отправляя заказ, вы передаёте имя, телефон и адрес продавцу, чтобы он с вами связался.</small>
      <button type="submit" class="buy" id="o-send">Отправить заказ</button>
      <button type="button" class="ghost" id="o-cancel">Отмена</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
  </div>
</aside>
<script src="products.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
